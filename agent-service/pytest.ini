[pytest]
# Pytest 配置文件
addopts = --cov=app --cov-fail-under=80

# 标记测试为异步
markers =
    asyncio: 标记为异步测试

# pytest-asyncio 配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试路径
testpaths = tests

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short

# Python 路径
pythonpath = .
